---
# A stand-in for the AEM AMIs aem-aws-stack-builder launches:
# Amazon Linux 2023 with OpenVox 9 and Cinc InSpec, which the steps run
HOSTS:
  amazon-2023-x86_64:
    roles:
      - default
    platform: amazon-2023-x86_64
    image: amazonlinux:2023
    hypervisor: docker
    # Keep the built image so these layers are cached between runs
    docker_preserve_image: true
    docker_image_commands:
      # amazonlinux:2023 ships without systemd, so /sbin/init has to be
      # installed
      - dnf install -y systemd tar gzip
      # Install the release package from yum.voxpupuli.org, or from its GWDG
      # mirror when yum.voxpupuli.org is down, so an outage doesn't block CI
      # yamllint disable-line rule:line-length
      - dnf install -y https://yum.voxpupuli.org/openvox9-release-amazon-2023.noarch.rpm || dnf install -y https://ftp.gwdg.de/pub/linux/openvox/yum/openvox9-release-amazon-2023.noarch.rpm
      # The repo file only points at yum.voxpupuli.org, so add the mirror as a
      # second baseurl, which dnf falls back to (the GPG key is in the release
      # package)
      # yamllint disable-line rule:line-length
      - sed -i 's|^baseurl=https://yum.voxpupuli.org/\(.*\)$|baseurl=https://yum.voxpupuli.org/\1 https://ftp.gwdg.de/pub/linux/openvox/yum/\1|' /etc/yum.repos.d/openvox9-release.repo
      - dnf install -y openvox-agent
      # Cinc InSpec at the version the AMIs provide
      # yamllint disable-line rule:line-length
      - curl -fsSL -o /tmp/install.sh https://omnitruck.cinc.sh/install.sh && bash /tmp/install.sh -P cinc-auditor -v 7.2.1 && rm /tmp/install.sh
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
